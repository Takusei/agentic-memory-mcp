[project]
name = "agentic-memory"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  # LangChain (1.x API — uses create_agent / LangGraph, not AgentExecutor)
  "langchain>=1.3",
  "langchain-core>=1.4",
  "langchain-openai>=1.2",

  # Vector store
  "chromadb>=0.5",

  # BM25
  "rank-bm25>=0.2",

  # Embeddings + reranker (local, no API cost)
  "sentence-transformers>=3.0",

  # MCP server
  "fastmcp>=2.0",

  # Utilities
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
